<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Valida — Cadastrou, validou é PIX</title>
    <meta name="description" content="Valida: indique, valide e receba via PIX. Ganhe R$3 por cadastro validado + bônus na conversão. Cadastro gratuito." />
    <meta name="keywords" content="valida, indicação, pix, ganhar dinheiro, programa indicação, proteção veicular, renda extra" />
    <meta name="author" content="Valida" />
    <meta name="theme-color" content="#1a9c62" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Valida — Cadastrou, validou é PIX" />
    <meta property="og:description" content="Indique, valide e receba via PIX. Ganhe por cada cadastro validado, mesmo antes da venda." />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="Valida" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="Valida — Cadastrou, validou é PIX" />
    <meta property="twitter:description" content="Indique, valide e receba via PIX. Ganhe por cada cadastro validado." />
    
    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Valida",
      "url": "https://valida-six.vercel.app",
      "logo": "https://valida-six.vercel.app/icon-512.png",
      "description": "Programa de indicação que realmente paga. Ganhe R$3 por cadastro validado + R$50 de bônus na conversão.",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "Rua Principal, 123",
        "addressLocality": "Urucuca",
        "addressRegion": "Bahia",
        "addressCountry": "BR"
      },
      "contactPoint": {
        "@type": "ContactPoint",
        "telephone": "+55-73-99999-9999",
        "contactType": "customer service"
      },
      "sameAs": [
        "https://instagram.com/leadflow",
        "https://facebook.com/leadflow"
      ]
    }
    </script>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <!--
      Ícones — todos gerados de uma geometria só (`npm run icons`), a partir do
      selo do Valida. O SVG cobre os navegadores modernos; os demais existem
      porque cada plataforma pede um formato diferente e, sem eles, cai no
      /favicon.ico padrão ou no PNG antigo.
    -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png" />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <!-- iOS: 180x180, quadrado cheio — o sistema aplica o arredondamento. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- Safari macOS, aba fixada: silhueta monocromática. -->
    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#1a9c62" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
