<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background Gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3730a3;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="pixGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background Square with rounded corners -->
  <rect x="2" y="2" width="60" height="60" rx="12" ry="12" fill="url(#bgGradient)"/>
  
  <!-- Kong Logo - Stylized K -->
  <g transform="translate(32, 32)">
    <!-- K Letter -->
    <path d="M -10 -12 L -10 12 L -4 12 L -4 2 L 2 -4 L 8 12 L 14 12 L 6 -6 L 12 -12 L 6 -12 L -4 -2 L -4 -12 Z" fill="white" stroke="white" stroke-width="1"/>
  </g>
  
  <!-- PIX Badge -->
  <g transform="translate(44, 44)">
    <circle r="8" fill="url(#pixGradient)"/>
    <text x="0" y="3" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="white" text-anchor="middle">PIX</text>
  </g>
</svg>