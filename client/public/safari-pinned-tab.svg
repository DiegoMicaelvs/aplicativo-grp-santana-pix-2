    Mesma geometria do favicon.svg, escalada 1,55x a partir do centro.
  -->
  <path d="M53.7 15.9 25 44.6 10.3 29.9"
        fill="none"
        stroke="#000000"
        stroke-width="10.9"
        stroke-linecap="round"
        stroke-linejoin="round"/>
