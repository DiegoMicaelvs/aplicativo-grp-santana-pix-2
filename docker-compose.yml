services:
  db:
    image: postgres:16-alpine
    container_name: kongpix-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-kongpix}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-kongpix}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      target: dev
    container_name: kongpix-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 5000
      # hot reload através do bind mount (ver Dockerfile / vite.config.ts)
      VITE_USE_POLLING: "true"
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-kongpix}
      DATABASE_SSL: "false"
      SESSION_SECRET: ${SESSION_SECRET:-dev-secret-troque-em-producao}
      MASTER_PASSWORD: ${MASTER_PASSWORD:-dev-master-password}
    ports:
      - "${APP_PORT:-5000}:5000"
    volumes:
      # código do host com hot reload
      - .:/app
      # node_modules do container (binários Linux) não podem ser sobrescritos pelo host
      - node_modules:/app/node_modules

  # Interface web para inspecionar o banco: docker compose --profile tools up -d adminer
  adminer:
    image: adminer:latest
    container_name: kongpix-adminer
    restart: unless-stopped
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db

volumes:
  # nomes fixos para não dependerem do nome da pasta do projeto
  pgdata:
    name: kongpix_pgdata
  node_modules:
    name: kongpix_node_modules
